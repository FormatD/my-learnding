name: Build and contract checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: learning_ci
          POSTGRES_PASSWORD: learning_ci_ephemeral
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: learning_ci
      PGPASSWORD: learning_ci_ephemeral
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Restore fixed dependencies
        run: |
          npm ci --prefix src/web
          dotnet restore src/server --locked-mode
          dotnet restore tests/acceptance --locked-mode
          dotnet restore tests/persistence --locked-mode
      - name: Read previous contract without modifying it
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          revision = event.get('pull_request', {}).get('base', {}).get('sha') or event.get('before', '')
          if revision and revision != '0' * 40:
              if not re.fullmatch('[0-9a-f]{40}', revision):
                  raise SystemExit('Invalid baseline revision')
              subprocess.run(['git', 'cat-file', '-e', revision], check=True)
              listed = subprocess.check_output(['git', 'ls-tree', '--name-only', revision, '--', 'docs/api/openapi.json'], text=True)
              if listed.strip():
                  baseline = subprocess.check_output(['git', 'show', revision + ':docs/api/openapi.json'])
                  pathlib.Path(os.environ['RUNNER_TEMP'], 'previous-openapi.json').write_bytes(baseline)
              else:
                  print('First contract introduction: previous revision has no snapshot.')
          else:
              print('No previous revision supplied; current contract equality still required.')
          PY
      - name: Build, live contract and previous revision gate
        run: |
          if test -f "$RUNNER_TEMP/previous-openapi.json"; then
            sh scripts/ci_check.sh "$RUNNER_TEMP/previous-openapi.json"
          else
            sh scripts/ci_check.sh
          fi
